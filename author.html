<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacticle Author</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/tacticle.css">
<style>
  .amain { flex: 1; display: grid; grid-template-columns: 340px 1fr 290px; min-height: 0; }
  .aside { background: var(--panel); overflow: auto; min-height: 0; }
  .aside.left { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .aside.right { border-left: 1px solid var(--line); padding: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .tabs button { border: 0; border-radius: 8px 8px 0 0; padding: 6px 9px; font-size: 13px; background: transparent; color: var(--muted); }
  .tabs button.on { background: var(--bg); color: var(--ink); font-weight: 650; }
  .tabbody { padding: 12px; }
  label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 3px; }
  label.f:first-child { margin-top: 0; }
  input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  textarea { min-height: 64px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 8px 0; }
  .chk input { width: auto; }
  .toolbar { position: absolute; left: 10px; top: 10px; right: 56px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; align-items: flex-start; pointer-events: none; }
  .toolbar > * { pointer-events: auto; }
  .tgroup { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); align-items: center; flex-wrap: wrap; max-width: 100%; }
  .tgroup button { border: 0; padding: 5px 9px; border-radius: 7px; font-size: 13px; background: transparent; }
  .tgroup button.on { background: var(--accent); color: #fff; }
  .tgroup select { width: auto; padding: 4px 6px; font-size: 13px; }
  .pal { display: flex; gap: 2px; flex-wrap: wrap; }
  .pal button { padding: 3px; border-radius: 7px; width: 32px; height: 32px; display: grid; place-items: center; }
  .pal button.on { outline: 2px solid var(--accent); }
  .ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ptable td { padding: 3px 2px; vertical-align: middle; }
  .ptable input, .ptable select { padding: 3px 4px; font-size: 13px; }
  .msg { font-size: 13px; margin: 3px 0; }
  .msg.error { color: var(--bad); }
  .msg.warn { color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chipx { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 1px 4px 1px 9px; font-size: 13px; }
  .chipx button { border: 0; background: transparent; padding: 0 4px; }
  .objbox { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
  .objbox.on { border-color: var(--accent); }
  .sched { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sched td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
  .sched tr.today td { background: #ffd23f33; }
  .sched tr.past td { color: var(--muted); }
  .sched select { padding: 3px 4px; font-size: 12.5px; }
  .plist .urow { cursor: default; }
  .plist .urow.cur { border-color: var(--accent); }
  .savestate { font-size: 12.5px; color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .kbd-help { font-size: 12px; color: var(--muted); line-height: 1.7; }
  @media (max-width: 1100px) { .amain { grid-template-columns: 300px 1fr; } .aside.right { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">TACTICLE<small>author</small></div>
  <span class="pill" id="hdrTitle"></span>
  <span class="savestate" id="saveState"></span>
  <div class="spacer"></div>
  <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
  <button id="bTest" title="Play this scenario in a new tab">▶ Play test</button>
  <button class="primary" id="bSave" title="Save (Ctrl+S)">Save</button>
</header>
<div class="amain">
  <aside class="aside left">
    <nav class="tabs" id="tabs"></nav>
    <div class="tabbody" id="tabbody"></div>
  </aside>
  <div class="mapwrap" id="map">
    <div class="toolbar" id="toolbar"></div>
    <div class="zoombar">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit to playable area">⤢</button>
      <button id="zworld" title="Whole map">🌐</button>
    </div>
  </div>
  <aside class="aside right" id="inspector"></aside>
</div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>
<div class="tooltip" id="tip"></div>
<script src="js/rulesets.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/generator.js"></script>
<script src="js/icons.js"></script>
<script src="js/mapview.js"></script>
<script src="js/daily.js"></script>
<script src="js/triplea.js"></script>
<script src="js/author.js"></script>
</body>
</html>
