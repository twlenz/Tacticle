<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; connect-src 'self' https://raw.githubusercontent.com https://*.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Tacticle Author</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/tacticle.css">
<style>
  :root { --warn-ink: #8a5d06; }
  :root[data-theme="dark"] { --warn-ink: #e5b75a; }
  .amain { flex: 1; display: grid; grid-template-columns: 340px 1fr 290px; min-height: 0; }
  .aside { background: var(--panel); overflow: auto; min-height: 0; }
.aside.left { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  /* pages (Select Map, Edit Map, Schedule, Files) and Edit Map's steps */
  .ptabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; }
  .ptabs button { border: 0; border-radius: 8px 8px 0 0; padding: 7px 4px; font-size: 13px; background: transparent; color: var(--muted); font-weight: 600; }
  .ptabs button.on { background: var(--bg); color: var(--ink); }
  .subtabs { display: flex; flex-direction: column; gap: 2px; padding: 8px; border-bottom: 1px solid var(--line); }
  .subtabs:empty { display: none; }
  .subtabs button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 8px; font-size: 14px; color: var(--muted); }
  .subtabs button.on { background: var(--bg); color: var(--ink); font-weight: 650; }
  .subtabs .num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 99px; background: var(--line); color: var(--ink); font-size: 12px; font-weight: 700; }
  .subtabs button.on .num { background: var(--ink); color: var(--bg); }
  .aside.left .tabbody { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  /* Select Map */
  .maplist { flex: 1; min-height: 160px; overflow: auto; display: flex; flex-direction: column; gap: 8px; margin: 6px 0 10px; padding-right: 2px; }
  .mapcard { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 6px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); }
  .mapcard.on { border-color: var(--accent); }
  .mapcard .thumb { height: 120px; border-radius: 6px; overflow: hidden; background: var(--ocean); display: grid; place-items: center; }
  .mapcard .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .mapcard .mname { font-weight: 650; font-size: 14px; }
  .mapcard .mname small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .actions.col { flex-direction: column; align-items: stretch; }
  #preview { position: absolute; inset: 0; display: none; z-index: 1; background: var(--ocean); }
  .pvinfo { position: absolute; left: 12px; top: 12px; z-index: 2; max-width: min(440px, 60%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); font-size: 13.5px; display: none; }
  .pvinfo h3 { margin: 0 0 2px; font-size: 16px; }
  /* bottom-right dock: Next, file name, Save, Schedule It (Edit Map); Select Map (Select Map) */
  .dock { position: absolute; right: 14px; bottom: 14px; z-index: 4; display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); }
  .dock:empty { display: none; }
  .dock .row { display: flex; gap: 6px; }
  .dock .row > button { flex: 1; white-space: nowrap; }
  .dock .row > #dkNext { flex: none; }
  .dock button { padding: 8px 10px; }
  .dock .saved { opacity: .55; }
  .dkwarn { margin: 0; font-size: 12.5px; color: var(--warn-ink); }
  .dkwarn:empty { display: none; }
  .dkhint { margin: -2px 0 0; font-size: 12px; }
  .dkhint code { font-size: 11.5px; }
  .warnink { color: var(--warn-ink); }
  /* finished steps */
  .subtabs button.done .num { background: var(--good); color: #fff; }
  .subtabs button.on .num { background: var(--ink); color: var(--bg); }
  /* checks with a link to the step that fixes them */
  .msg { display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
  button.link { flex: none; border-color: transparent; background: transparent; color: var(--accent); text-decoration: underline; padding: 0 2px; font-size: 12.5px; white-space: nowrap; }
  /* sections that fold away */
  details.fold { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.fold > summary { cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
  details.fold > summary .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  details.fold[open] > summary { margin-bottom: 6px; }
  .urow.zero .nm, .urow.zero output { color: var(--muted); }
  .urow.zero .ic { opacity: .55; }
  .askbody ul { margin: 6px 0; padding-left: 20px; }
  /* the answer that throws something away is plain, with red text; Cancel is the default */
  .actions.end { justify-content: flex-end; }
  .actions.end .primary { flex: none; }
  button.danger { color: var(--bad); border-color: var(--bad); font-weight: 600; }
  button.primary:disabled { background: var(--panel); color: var(--muted); border-color: var(--line); }
  .askbody li { margin: 2px 0; }
  /* toasts can carry an action (Undo) */
  #toast { display: flex; gap: 12px; align-items: center; justify-content: center; top: 104px; }
  #toast.act { pointer-events: auto; }
  #toast button { background: transparent; color: inherit; border-color: currentColor; }
  /* a click in place mode adds a unit */
  body[data-tool="units"] #map .tmap, body[data-tool="units"] #map .tmap * { cursor: copy; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Place Units */
  .unitpal { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin: 8px 0; }
  .unitpal button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 12px; }
  .unitpal button.on { border-color: var(--accent); background: var(--panel); }
  .powlist { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .powlist button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 2px solid var(--line); border-radius: 99px; background: var(--bg); font-size: 13px; }
  .powlist button.on { border-color: var(--accent); background: var(--panel); font-weight: 650; }
  button.on.toggle { border-color: var(--accent); }
  /* full pages: Schedule and Files */
  #page { display: none; overflow: auto; padding: 16px 22px; background: var(--bg); min-height: 0; }
  body[data-page="schedule"] #page, body[data-page="files"] #page { display: block; }
  body[data-page="schedule"] .mapwrap, body[data-page="files"] .mapwrap { display: none; }
  body[data-page="select"] #preview, body[data-page="select"] .pvinfo { display: block; }
  body[data-page="select"] .toolbar, body[data-page="select"] .zoombar { display: none; }
  body:not([data-page="edit"]) .amain { grid-template-columns: 340px 1fr; }
  body:not([data-page="edit"]) .aside.right { display: none; }
  #page .wide { max-width: 860px; }
  .aside.right { border-left: 1px solid var(--line); padding: 12px; }
  .tabbody { padding: 12px; }
  label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 3px; }
  label.f:first-child { margin-top: 0; }
  input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  textarea { min-height: 64px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 8px 0; }
  .chk input { width: auto; }
  .toolbar { position: absolute; left: 10px; top: 10px; right: 56px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; align-items: flex-start; pointer-events: none; }
  .toolbar > * { pointer-events: auto; }
  .tgroup { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); align-items: center; flex-wrap: wrap; max-width: 100%; }
  .tgroup button { border: 0; padding: 5px 9px; border-radius: 7px; font-size: 13px; background: transparent; }
  .tgroup button.on { background: var(--accent); color: #fff; }
  .tgroup select { width: auto; padding: 4px 6px; font-size: 13px; }
  .pal { display: flex; gap: 2px; flex-wrap: wrap; }
  .pal button { padding: 3px; border-radius: 7px; width: 32px; height: 32px; display: grid; place-items: center; }
  .tgroup.pal button.on { background: var(--bg); outline: 2px solid var(--accent); }
  .ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ptable td { padding: 3px 2px; vertical-align: middle; }
  .ptable input, .ptable select { padding: 3px 4px; font-size: 13px; }
  .msg { font-size: 13px; margin: 3px 0; }
  .msg.error { color: var(--bad); }
  .msg.warn { color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chipx { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 1px 4px 1px 9px; font-size: 13px; }
  .chipx button { border: 0; background: transparent; padding: 0 4px; }
  .objbox { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
  .objbox.on { border-color: var(--accent); }
  .sched { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sched td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
  .sched tr.today td { background: #ffd23f33; }
  .sched tr.past td { color: var(--muted); }
  .sched select { padding: 3px 4px; font-size: 12.5px; }
  .plist .urow { cursor: default; }
  .plist .urow.cur { border-color: var(--accent); }
  .savestate { font-size: 12.5px; color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .kbd-help { font-size: 12px; color: var(--muted); line-height: 1.7; }
  @media (max-width: 1100px) { .amain, body[data-page] .amain { grid-template-columns: 300px 1fr; } .aside.right { display: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">TACTICLE<small>author</small></div>
  <span class="pill" id="hdrTitle"></span>
  <span class="savestate" id="saveState"></span>
  <div class="spacer"></div>
  <button id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
  <button id="bRedo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
  <button id="bTest" title="Play this scenario in a new tab (Ctrl+Enter)">▶ Play test</button>
</header>
<div class="amain">
  <aside class="aside left">
    <nav class="ptabs" id="tabs" role="tablist" aria-label="Authoring sections"></nav>
    <nav class="subtabs" id="subtabs" aria-label="Steps of Edit Map"></nav>
    <div class="tabbody" id="tabbody"></div>
  </aside>
  <div class="mapwrap" id="map">
    <div id="preview"></div>
    <div class="pvinfo" id="pvInfo"></div>
    <div class="dock" id="dock"></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="zoombar">
      <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zfit" title="Fit to the territories in play" aria-label="Fit to the territories in play">⤢</button>
      <button id="zworld" title="Whole map" aria-label="Whole map">🌐</button>
    </div>
  </div>
  <div id="page"></div>
  <aside class="aside right" id="inspector"></aside>
</div>
<footer class="credit">Tacticle brought to you by Tommy Lenz and Abie Sprain</footer>
<div class="modal" id="modal"><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tooltip" id="tip"></div>
<script src="js/rulesets.js"></script>
<script src="js/engine.js"></script>
<script src="js/value.js"></script>
<script src="js/ai.js"></script>
<script src="js/generator.js"></script>
<script src="js/icons.js"></script>
<script src="js/mapview.js"></script>
<script src="js/daily.js"></script>
<script src="js/triplea.js"></script>
<script src="js/localmaps.js"></script>
<script src="js/results.js"></script>
<script src="js/author.js"></script>
</body>
</html>
